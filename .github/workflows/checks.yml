name: Validate documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # PoC: efter första npm install, committa package-lock.json och byt till npm ci.
      - run: npm install --no-audit --no-fund
      - run: npm run docs:build
